services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: exomusica
      POSTGRES_USER: exomusica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
      - backend/.env
    depends_on: [postgres]
    volumes:
      - uploads:/app/uploads # 65MB/user quota is enforced in app code, not disk quota
    networks: [internal, web]

  # frontend/ is built as part of the Caddy image (see Dockerfile.caddy) —
  # no separate frontend container needed, one fewer moving piece.

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on: [backend]
    networks: [web]

networks:
  internal:
  web:

volumes:
  pgdata:
  uploads:
  caddy_data:
